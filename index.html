<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delicious Bites Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Delicious Bites</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="home">
    <h2>Welcome to Our Restaurant</h2>
    <p>Enjoy the best food in town!</p>
</section>

<section id="menu">
    <h2>Our Menu</h2>
    <div class="menu-item">
        <h3>Pizza</h3>
        <p>₹250</p>
    </div>
    <div class="menu-item">
        <h3>Burger</h3>
        <p>₹150</p>
    </div>
    <div class="menu-item">
        <h3>Pasta</h3>
        <p>₹200</p>
    </div>
</section>

<section id="about">
    <h2>About Us</h2>
    <p>We serve fresh and delicious food with love.</p>
</section>

<section id="contact">
    <h2>Contact Us</h2>
    <form onsubmit="return validateForm()">
        <input type="text" id="name" placeholder="Your Name"><br>
        <input type="email" id="email" placeholder="Your Email"><br>
        <textarea id="message" placeholder="Your Message"></textarea><br>
        <button type="submit">Submit</button>
    </form>
</section>

<footer>
    <p>© 2026 Delicious Bites</p>
</footer>

<script src="script.js"></script>
</body>
</html>
